version: '3.9'

services:
  db:
    image: postgres:15
    container_name: ensemble_db
    restart: always
    environment:
      POSTGRES_DB: ensemble_db
      POSTGRES_USER: ensemble_user
      POSTGRES_PASSWORD: ensemble_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ensemble_user -d ensemble_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ensemble_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ensemble_user:ensemble_pass@db:5432/ensemble_db
      SECRET_KEY: changeme_in_production_use_openssl_rand
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: ensemble_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
